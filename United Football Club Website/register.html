<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - United FC</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <nav id="main-nav">
    <div class="logo">
        <a href="home.html">
            <img src="images/logo.png" alt="United FC">
        </a>
        <span>United FC</span>
    </div>

    <ul class="nav-links">
        <li><a href="home.html">HOME</a></li>
        <li><a href="#">▶ WATCH</a></li>
        <li><a href="team.html">TEAM</a></li>
        <li><a href="dashboard.html">DASHBOARD</a></li>
        <li><a href="admin.html">ADMIN</a></li>
    </ul>

    <div class="nav-icons">
        <div class="search-icon" onclick="toggleSearch()">🔍</div>
            <input type="text" id="searchBox" placeholder="Search...">
            <div id="searchResults"></div>

        <div class="theme-toggle" onclick="toggleDarkMode()">🌙</div>
        <!-- <div class="more-menu" onclick="openMenu()">
            <div class="menu-icon">
                <span></span><span></span><span></span>
            </div>
            <p>MORE</p>
        </div> -->
    </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Create Account</h2>
            <p>Join United FC Community</p>
            
            <form id="registerForm">
                <input type="text" id="regName" placeholder="Full Name" required>
                <input type="email" id="regEmail" placeholder="Email Address" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                
                <div id="passwordRequirements" class="requirements" style="display:none; margin:10px 0;">
                    <div>At least 6 characters</div>
                    <div>One uppercase letter</div>
                    <div>One number</div>
                    <div>One special character (@ # _ - ! etc.)</div>
                </div>

                <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
                
                <button type="submit" class="auth-btn">CREATE ACCOUNT</button>
            </form>
            
            <p class="switch-text">Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
</body>
</html>
