<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academy Trials Registration - United FC</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

   <!-- TOP WHITE BAR -->
<div class="top-bar">
    <div class="auth-buttons">
        <a href="register.html" class="auth-link register-btn">REGISTER</a>
        <a href="login.html" class="auth-link">LOGIN</a>
    </div>
</div>

<!-- MAIN NAV -->
<nav id="main-nav">
    <div class="logo">
        <a href="home.html">
            <img src="images/logo.png" alt="United FC">
        </a>
        <span>United FC</span>
    </div>

    <ul class="nav-links">
        <li><a href="home.html">HOME</a></li>
        <li><a href="#">▶ WATCH</a></li>
        <li><a href="team.html">TEAM</a></li>
        <li><a href="dashboard.html">DASHBOARD</a></li>
        <li><a href="admin.html">ADMIN</a></li>
    </ul>

    <div class="nav-icons">
        <div class="user-profile" id="userProfile" style="display: none;">
            <div class="profile-icon" onclick="toggleProfileDropdown()">👤</div>
            <div class="profile-dropdown" id="profileDropdown">
                <p id="userGreeting">Hi, User</p>
                <button onclick="viewMyApplication()" class="dropdown-btn">View My Application</button>
                <button onclick="logout()" class="dropdown-btn logout-btn">Logout</button>
            </div>
        </div>
        <div class="search-icon" onclick="toggleSearch()">🔍</div>
            <input type="text" id="searchBox" placeholder="Search...">
            <div id="searchResults"></div>

        <div class="theme-toggle" onclick="toggleDarkMode()">🌙</div>
        <div class="more-menu" onclick="openMenu()">
           <button class="menu-icon">
                <span></span><span></span><span></span>
                MORE
            </button>
        </div>
    </div>
</nav>

    <!-- Premium Hero -->
    <section class="trials-hero">
        <div class="hero-content">
            <h1>UNITED FC ACADEMY TRIALS 2026</h1>
            <p>Show us what you've got. Join the next generation of champions.</p>
            <div class="hero-badge">Ages 8 — 19 Years</div>
        </div>
    </section>

    <!-- Main Form -->
    <div class="trials-container">
        <div class="form-wrapper">
            <h2>Player Registration Form</h2>
            <p class="subtitle">Fill in your details to apply for trials</p>
            
            <form id="trialsForm" class="trials-form">
                <div class="form-grid">
                    <div>
                        <label>Full Name <span>*</span></label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div>
                        <label>Date of Birth <span>*</span></label>
                        <input type="date" id="dob" required>
                    </div>
                    <div>
                        <label>Position <span>*</span></label>
                        <select id="position" required>
                            <option value="">Select Position</option>
                            <option value="Forward">Forward</option>
                            <option value="Midfielder">Midfielder</option>
                            <option value="Defender">Defender</option>
                            <option value="Goalkeeper">Goalkeeper</option>
                        </select>
                    </div>
                    <div>
                        <label>Preferred Foot</label>
                        <select id="preferredFoot">
                            <option value="Right">Right</option>
                            <option value="Left">Left</option>
                            <option value="Both">Both</option>
                        </select>
                    </div>
                    <div>
                        <label>Height (cm)</label>
                        <input type="number" id="height" placeholder="e.g. 165">
                    </div>
                    <div>
                        <label>Contact Phone <span>*</span></label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div>
                        <label>Parent/Guardian Name</label>
                        <input type="text" id="guardian">
                    </div>
                    <div>
                        <label>Email Address <span>*</span></label>
                        <input type="email" id="email" required>
                    </div>
                </div>

                <div class="full-width">
                    <label>Why do you want to join United FC Academy? (Optional)</label>
                    <textarea id="message" rows="5" placeholder="Tell us about yourself, your football journey..."></textarea>
                </div>

                <button type="submit" class="submit-trial-btn">
                    SUBMIT APPLICATION
                </button>
            </form>
        </div>
    </div>

    
    
    
    
    
    
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>   
<script src="js/trials.js"></script>
<script src="js/home.js"></script>
</body>
</html>
